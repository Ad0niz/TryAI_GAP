<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <!-- Símbolo del Puente Abstracto -->
  <!-- Arco principal (Azul tecnológico) -->
  <path d="M 30 85 L 30 55 C 30 20, 100 20, 100 55 L 100 85" fill="none" stroke="#2563EB" stroke-width="16" stroke-linecap="round" />
  
  <!-- Pilares (Azul marino oscuro) -->
  <rect x="22" y="55" width="16" height="40" fill="#0F172A" rx="6" />
  <rect x="92" y="55" width="16" height="40" fill="#0F172A" rx="6" />
  
  <!-- Punto de conexión central (El "Gap" cerrado) -->
  <circle cx="65" cy="35" r="8" fill="#38BDF8" />

  <!-- Texto del Logo -->
  <!-- "tryAI" en negrita para destacar -->
  <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#0F172A" letter-spacing="-1.5">tryAI</text>
  
  <!-- "Gap" más delgado para dar contraste -->
  <text x="285" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="300" fill="#64748B" letter-spacing="-1">Gap</text>
</svg>
