services:

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 20


  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.local

    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      JWT_SECRET: ${JWT_SECRET}

      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:8080
      WEB_APP_URL: http://localhost:8080

      LOG_LEVEL: INFO

      ACCESS_TOKEN_TTL_MIN: 15
      REFRESH_TOKEN_TTL_DAYS: 30
      MAGIC_LINK_TTL_MIN: 15
      DELEGATION_TTL_HOURS: 72

      FREE_MATURITY_LIMIT: 5

      LOCAL_STORAGE_DIR: /workspace/backend/_storage

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER: evidence

      ACS_CONNECTION_STRING: ""
      ACS_SENDER_ADDRESS: DoNotReply@localhost

      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_SUCCESS_URL: http://localhost:8080/payment/success
      STRIPE_CANCEL_URL: http://localhost:8080/estimator

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - storage_data:/workspace/backend/_storage

    depends_on:
      db:
        condition: service_healthy


  web:
    build:
      context: .
      dockerfile: web/Dockerfile

      args:
        VITE_API_URL: ${VITE_API_URL}

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      api:
        condition: service_healthy


volumes:
  postgres_data:
  storage_data: